# Painite extras. Vanilla settings (port, motd, max-players, view-distance, white-list, ...)
# stay in server.properties exactly like a normal Minecraft server directory.

[network]
bedrock          = true
bedrock_port     = "same"   # a number, or "same" to reuse server-port over UDP (like Geyser's clone-remote-port)
bedrock_version  = "1.26.52" # shown in the Bedrock server list; the protocol number comes from the data file
bedrock_encryption = true   # vanilla-style encrypted session; clients expect it from Bedrock servers
bedrock_prefix   = "."      # prepended to Bedrock player names (Floodgate does the same)
bedrock_unauthenticated = false  # allow Bedrock logins while Java online-mode=true (no Xbox verification yet!)

[bandwidth]
profile           = "auto"  # auto: no compression for LAN/loopback peers, zlib for everyone else
                            # lan: never compress | wan / lossy: always compress
compression_level = 3       # zlib level; network-compression-threshold in server.properties sets the size cutoff
chunk_cache_mb    = 256     # cache of compressed chunk packets (counts toward memory_cap_mb)
backlog_cap_kb    = 256     # pause chunk sending while a client has more than this queued

[cpu]
cores = "all"               # "all", "0-7", "0,2,4" or [0, 2, 4]; CLI --cores overrides
pin   = true                # pin each worker thread to one of the cores

[workers]
min                 = 1
max                 = 0     # 0 = number of cores
memory_cap_mb       = 1024  # hard cap for connection buffers + chunk cache across all workers
spawn_busy_pct      = 70    # start another worker when the average worker is busier than this
retire_after_idle_s = 60    # retire a worker with no connections after this long

[auth]
# session_host    = "sessionserver.mojang.com"   # host or host:port, used when online-mode=true
# session_ca_file = ""                          # optional CA bundle for a private auth server

[server]
files_poll_ms = 3000          # how often ops.json, banned-players.json, whitelist.json and server-icon.png are checked for edits
# All-in-one server settings (can be defined here instead of server.properties)
# port = 25565
# ip = ""
# motd = "A Painite Server"
# max_players = 20
# online_mode = false
# view_distance = 10
# simulation_distance = 10
# gamemode = "survival"
# difficulty = "easy"
# hardcore = false
# spawn_protection = 0

[info]
server_type = "Painite"
version = "0.1.0"
github = "https://github.com/BeanGreen247/painite"

[startup]
# Commands to execute in console upon server startup
commands = [
    "time set day",
    "version"
]

[world]
worldgen_version = "26.2"  # which Mojang version's terrain, structures and features to reproduce: 26.1 | 26.2 (clients of every supported version can still join)
generator   = "auto"   # for chunks not on disk: auto (terrain or flat for a new world as set by level-type, void when region files exist) | terrain | flat | void
# name      = "world"
# level_type = "normal"  # normal | flat | void | large_biomes | amplified
# seed      = ""
autosave_s  = 300      # write changed chunks and player data this often (seconds)
tick_threads = 0       # threads that tick regions (block updates) in parallel; 0 = half the cores, at most 4

[paths]
# data_dir = "data"         # where vanilla-<version>.bin/.ids from tools/fetch_vanilla_data.py live
